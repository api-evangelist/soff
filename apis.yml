name: Soff
description: Soff is an AI-powered quoting platform for U.S. distributors that turns
  inbound RFQs into won deals. It automatically captures requests for quotes from email,
  generates instant quotes and PDFs, tracks quote performance (won vs. lost), logs
  activity into ERP/CRM systems, and analyzes customer behavior and lost-deal reasons.
  Backed by Y Combinator (S24) and General Catalyst, based in San Francisco, and SOC 2
  Type II certified. As of this enrichment pass Soff publishes no public developer API,
  documentation portal, or well-known discovery surface.
